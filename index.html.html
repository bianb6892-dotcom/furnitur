<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumah Teduh – Toko Furnitur Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFE6D2;--surface:#F7F0E0;--soft:#D5E6D3;--soft2:#BBD7C4;--em:#0E6B53;--ink:#17302A;--muted:#5B6F66;--line:#D9CFB6;--on-em:#F7F0E0;--hero:#0E5A47;--hero-ink:#F3EBDA;--danger:#9B3B2F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1F1A;--surface:#16302A;--soft:#1F4136;--soft2:#2A5646;--em:#3FC49A;--ink:#EAF1E6;--muted:#9DB5A8;--line:#2B4A3F;--on-em:#0F1F1A;--hero:#12493B;--danger:#E58B7C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1F1A;--surface:#16302A;--soft:#1F4136;--soft2:#2A5646;--em:#3FC49A;--ink:#EAF1E6;--muted:#9DB5A8;--line:#2B4A3F;--on-em:#0F1F1A;--hero:#12493B;--danger:#E58B7C;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(23,48,42,.035)}
header .wrap{display:flex;align-items:center;gap:16px;height:72px}
.logo{display:flex;align-items:center;gap:9px;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:20px;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--em);display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.search{flex:1;max-width:460px;margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:11px 18px;min-width:0}
.search:focus{border-color:var(--em);outline:none}
.tabs{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.tab{border:0;background:none;padding:7px 15px;border-radius:999px;font-weight:600;color:var(--muted)}
.tab[aria-pressed=true]{background:var(--em);color:var(--on-em)}
.cartbtn{position:relative;border:0;background:var(--soft);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.cartbtn b{position:absolute;top:-3px;right:-3px;background:var(--em);color:var(--on-em);font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:28px;margin:26px 0 24px;display:grid;grid-template-columns:1fr 1fr;align-items:stretch;overflow:hidden;min-height:360px;box-shadow:0 16px 40px rgba(23,48,42,.10)}
.hero div:first-child{padding:clamp(28px,5vw,58px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.hero h1{font-size:clamp(28px,4.6vw,48px);max-width:14ch}
.hero p{margin:14px 0 24px;max-width:42ch;opacity:.88}
.hero .art{background:var(--soft2);align-self:stretch;display:block;position:relative;min-height:320px;padding:0;overflow:hidden;--c1:var(--hero);--c2:var(--surface)}.hero .art img{width:100%;height:100%;min-height:360px;object-fit:cover;display:block}.hero .art:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(14,40,31,.24));pointer-events:none}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--em);color:var(--on-em);transition:transform .18s,filter .18s}.btn:hover{filter:brightness(.96);transform:translateY(-1px)}
.btn.light{background:var(--hero-ink);color:var(--hero)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.del{background:none;color:var(--danger);border:1px solid var(--danger)}
.chips{display:flex;gap:9px;overflow-x:auto;padding:4px 0 18px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600}
.chip[aria-pressed=true]{background:var(--em);border-color:var(--em);color:var(--on-em)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:20px;padding-bottom:48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}.card:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(23,48,42,.10);border-color:var(--soft2)}
.thumb{height:220px;display:block;position:relative;overflow:hidden;background:var(--soft);--c1:var(--em);--c2:var(--soft2)}.thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}.card:hover .thumb img{transform:scale(1.045)}.thumb .photo-label{position:absolute;left:12px;top:12px;background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.thumb svg,.art svg{width:70%;max-width:190px;height:auto}
.card .body{padding:17px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.tag{font-size:12px;font-weight:600;color:var(--em)}
.card h3{font-size:19px;letter-spacing:-.02em}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.65;flex:1;min-height:42px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.price{font-weight:700;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 16px}
.stat{background:var(--soft);border-radius:18px;padding:16px 18px}
.stat small{color:var(--muted);font-weight:600}.stat b{display:block;font-family:Fraunces,Georgia,serif;font-size:26px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow-x:auto;margin-bottom:40px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--muted);background:var(--soft)}
tr:last-child td{border-bottom:0}
.mini{width:44px;height:44px;border-radius:12px;background:var(--soft2);display:grid;place-items:center;--c1:var(--em);--c2:var(--soft)}
.mini svg{width:30px}
.pn{display:flex;gap:12px;align-items:center;font-weight:600}
.acts{display:flex;gap:6px}
.low{color:var(--danger);font-weight:700}
dialog{border:0;border-radius:22px;background:var(--surface);color:var(--ink);padding:24px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(10,40,30,.55)}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:30;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}
.drawer.open{transform:none}
.items{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:14px 0}
.ci{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:16px;padding:10px}
.ci .mini{flex:none}.ci div:nth-child(2){flex:1;min-width:0;font-weight:600}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:26px;height:26px;border-radius:50%;border:0;background:var(--soft);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--em);color:var(--on-em);padding:11px 20px;border-radius:999px;font-weight:600;z-index:50;transition:transform .25s}
.toast.show{transform:translate(-50%,0)}
h2.sec{font-size:30px;margin:5px 0 7px}.introbar{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:28px 0 14px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--em)}.introcopy{margin:0;color:var(--muted);font-size:14px}.trust{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.trust span{font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 11px;color:var(--muted)}
@media (max-width:760px){.wrap{padding:0 15px}.hero{grid-template-columns:1fr;min-height:0}.hero div:first-child{padding:28px 24px}.hero .art{min-height:220px}.hero .art img{min-height:240px;max-height:280px}.search{display:none}.tabs{margin-left:auto}.logo span{display:none}.stats{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.thumb{height:155px}.card{border-radius:17px}.card .body{padding:12px}.card h3{font-size:16px}.card p{font-size:12px}.price{font-size:14px}.btn.sm{padding:7px 10px}.hero h1{font-size:32px}.introbar{align-items:flex-start;flex-direction:column}.trust{justify-content:flex-start}.introcopy{font-size:13px}h2.sec{font-size:25px}}@media (max-width:420px){.thumb{height:135px}.card .body{padding:10px}.card h3{font-size:15px}.row{align-items:flex-start;flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo"><i><svg viewBox="0 0 24 24" fill="none" stroke="var(--on-em)" stroke-width="2.2" stroke-linecap="round"><path d="M4 12V9a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3M3 12h18v5H3zM6 17v3M18 17v3"/></svg></i><span>Rumah Teduh</span></div>
  <input id="q" class="search" type="search" placeholder="Cari sofa, meja, lemari" aria-label="Cari produk">
  <div class="tabs" role="group" aria-label="Mode"><button class="tab" data-v="toko" aria-pressed="true">Toko</button><button class="tab" data-v="admin" aria-pressed="false">Kelola</button></div>
  <button class="cartbtn" id="cartOpen" aria-label="Buka keranjang"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><b id="cnt">0</b></button>
</div></header>

<main class="wrap">
 <section id="vToko">
  <div class="hero"><div><h1>Furnitur hangat untuk rumah yang tenang</h1><p>Pilihan sofa, meja, dan kasur dengan warna alami. Pesan dari rumah, kirim ke seluruh Indonesia.</p><button class="btn light" id="shop">Lihat koleksi</button></div>
  <div class="art" id="heroArt"></div></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
 </section>
 <section id="vAdmin" hidden>
  <h2 class="sec">Kelola produk</h2>
  <div class="stats"><div class="stat"><small>Total produk</small><b id="s1">0</b></div><div class="stat"><small>Total stok</small><b id="s2">0</b></div><div class="stat"><small>Nilai persediaan</small><b id="s3">0</b></div></div>
  <div class="bar"><span style="color:var(--muted)" id="s4"></span><button class="btn" id="add">Tambah produk</button></div>
  <div class="tablebox"><table><thead><tr><th>Produk</th><th>Kategori</th><th>Harga</th><th>Stok</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
 </section>
</main>

<aside class="drawer" id="drawer" aria-label="Keranjang">
  <div class="bar" style="margin:0"><h2 style="font-size:22px">Keranjang</h2><button class="btn ghost sm" id="cartClose">Tutup</button></div>
  <div class="items" id="items"></div>
  <div class="row" style="margin:0 0 12px"><span>Total</span><span class="price" id="total">Rp0</span></div>
  <button class="btn" id="checkout">Pesan sekarang</button>
</aside>

<dialog id="dlg"><h2 id="dt" style="font-size:22px">Tambah produk</h2>
 <label for="fn">Nama produk</label><input id="fn" class="in" maxlength="60">
 <div class="two"><div><label for="fc">Kategori</label><select id="fc" class="in"></select></div><div><label for="fs">Stok</label><input id="fs" class="in" type="number" min="0"></div></div>
 <label for="fp">Harga (Rp)</label><input id="fp" class="in" type="number" min="0" step="1000">
 <label for="fd">Deskripsi</label><textarea id="fd" class="in" rows="3" maxlength="140"></textarea>
 <div class="err" id="err" role="alert"></div>
 <div class="foot"><button class="btn ghost" id="fx">Batal</button><button class="btn" id="fsave">Simpan produk</button></div>
</dialog>
<dialog id="cd"><h2 style="font-size:22px">Hapus produk?</h2><p id="cdt" style="color:var(--muted)"></p><div class="foot"><button class="btn ghost" id="cn">Batal</button><button class="btn del" id="cy">Hapus produk</button></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const CATS=["Sofa","Kursi","Meja","Kasur","Lemari","Lampu"];
const seed=[
 {id:1,n:"Sofa Lindung 3 Dudukan",c:"Sofa",p:4850000,s:8,d:"Busa padat, kain tahan noda, rangka kayu jati."},
 {id:2,n:"Sofa Sudut Rimba",c:"Sofa",p:7250000,s:3,d:"Model L untuk ruang keluarga yang luas."},
 {id:3,n:"Kursi Makan Alder",c:"Kursi",p:650000,s:24,d:"Sandaran melengkung, nyaman untuk makan lama."},
 {id:4,n:"Kursi Kerja Sandar",c:"Kursi",p:1350000,s:12,d:"Tinggi dudukan bisa diatur, roda senyap."},
 {id:5,n:"Meja Makan Oval 6 Kursi",c:"Meja",p:3900000,s:5,d:"Top kayu solid dengan finishing doff."},
 {id:6,n:"Kasur Panti Queen",c:"Kasur",p:5200000,s:6,d:"Rangka kayu dengan headboard berlapis kain."},
 {id:7,n:"Lemari Pakaian 3 Pintu",c:"Lemari",p:3150000,s:2,d:"Rak gantung dan laci dalam, pintu geser halus."},
 {id:8,n:"Lampu Lantai Pelita",c:"Lampu",p:480000,s:15,d:"Cahaya hangat, kap kain linen."}
];
const K="rumah-teduh-v1";let P;
try{P=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!Array.isArray(P)||!P.length)P=seed.slice();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(P))}catch(e){}};
const $=s=>document.querySelector(s);
const rp=n=>"Rp"+Number(n).toLocaleString("id-ID");
const esc=t=>String(t).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const IC={
Sofa:'<rect x="14" y="34" width="92" height="30" rx="9" fill="var(--c1)"/><rect x="24" y="20" width="72" height="24" rx="9" fill="var(--c1)" opacity=".75"/><rect x="8" y="38" width="16" height="28" rx="7" fill="var(--c1)"/><rect x="96" y="38" width="16" height="28" rx="7" fill="var(--c1)"/><rect x="24" y="66" width="5" height="8" fill="var(--c1)"/><rect x="91" y="66" width="5" height="8" fill="var(--c1)"/>',
Kursi:'<rect x="38" y="12" width="44" height="34" rx="8" fill="var(--c1)" opacity=".75"/><rect x="34" y="44" width="52" height="12" rx="6" fill="var(--c1)"/><rect x="38" y="56" width="5" height="22" fill="var(--c1)"/><rect x="77" y="56" width="5" height="22" fill="var(--c1)"/>',
Meja:'<rect x="12" y="30" width="96" height="10" rx="5" fill="var(--c1)"/><rect x="24" y="40" width="6" height="36" fill="var(--c1)"/><rect x="90" y="40" width="6" height="36" fill="var(--c1)"/><rect x="40" y="48" width="40" height="5" rx="2" fill="var(--c1)" opacity=".6"/>',
Kasur:'<rect x="10" y="18" width="10" height="56" rx="4" fill="var(--c1)" opacity=".75"/><rect x="10" y="44" width="100" height="18" rx="7" fill="var(--c1)"/><rect x="26" y="34" width="26" height="12" rx="6" fill="var(--c1)" opacity=".6"/><rect x="100" y="62" width="8" height="12" fill="var(--c1)"/>',
Lemari:'<rect x="26" y="8" width="68" height="68" rx="6" fill="var(--c1)"/><rect x="58" y="12" width="3" height="60" fill="var(--c2)"/><circle cx="53" cy="44" r="2.5" fill="var(--c2)"/><circle cx="67" cy="44" r="2.5" fill="var(--c2)"/><rect x="32" y="76" width="6" height="6" fill="var(--c1)"/><rect x="82" y="76" width="6" height="6" fill="var(--c1)"/>',
Lampu:'<path d="M42 12h36l9 28H33z" fill="var(--c1)"/><rect x="58" y="40" width="4" height="34" fill="var(--c1)" opacity=".75"/><rect x="44" y="74" width="32" height="6" rx="3" fill="var(--c1)"/>'};
const svg=c=>'<svg viewBox="0 0 120 90" aria-hidden="true">'+(IC[c]||IC.Sofa)+'</svg>';
const PHOTO={
 Sofa:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=1000&q=85",
 Kursi:"https://images.unsplash.com/photo-1503602642458-232111445657?auto=format&fit=crop&w=900&q=85",
 Meja:"https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?auto=format&fit=crop&w=900&q=85",
 Kasur:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=900&q=85",
 Lemari:"https://images.unsplash.com/photo-1595428774223-ef52624120d2?auto=format&fit=crop&w=900&q=85",
 Lampu:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=900&q=85"
};
const photo=c=>PHOTO[c]||PHOTO.Sofa;
$("#heroArt").innerHTML='<img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1200&q=90" alt="Ruang keluarga dengan furnitur bernuansa alami" loading="eager">';
let cat="Semua",view="toko",cart={},editId=null,delId=null;
const byId=id=>P.find(x=>x.id===id);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2200)}
function filtered(){const q=$("#q").value.trim().toLowerCase();return P.filter(x=>(cat==="Semua"||x.c===cat)&&(!q||(x.n+" "+x.c+" "+x.d).toLowerCase().includes(q)))}
function renderShop(){
 $("#chips").innerHTML=["Semua",...CATS].map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`).join("");
 const l=filtered();
 $("#grid").innerHTML=l.length?l.map(x=>`<article class="card"><div class="thumb"><img src="${photo(x.c)}" alt="${esc(x.n)}" loading="lazy"><span class="photo-label">${esc(x.c)}</span></div><div class="body"><span class="tag">${esc(x.c)}</span><h3>${esc(x.n)}</h3><p>${esc(x.d)}</p><div class="row"><span class="price">${rp(x.p)}</span>${x.s>0?`<button class="btn sm" data-buy="${x.id}">Tambah</button>`:`<span class="low">Habis</span>`}</div></div></article>`).join(""):`<div class="empty" style="grid-column:1/-1">Produk tidak ditemukan. Coba kata kunci atau kategori lain.</div>`;
}
function renderAdmin(){
 const l=filtered();
 $("#s1").textContent=P.length;$("#s2").textContent=P.reduce((a,x)=>a+x.s,0);$("#s3").textContent=rp(P.reduce((a,x)=>a+x.s*x.p,0));
 $("#s4").textContent=l.length+" produk ditampilkan";
 $("#tb").innerHTML=l.length?l.map(x=>`<tr><td><div class="pn"><div class="mini">${svg(x.c)}</div>${esc(x.n)}</div></td><td>${esc(x.c)}</td><td>${rp(x.p)}</td><td class="${x.s<=3?"low":""}">${x.s}</td><td><div class="acts"><button class="btn ghost sm" data-edit="${x.id}">Ubah</button><button class="btn del sm" data-del="${x.id}">Hapus</button></div></td></tr>`).join(""):`<tr><td colspan="5" class="empty">Belum ada produk. Pilih Tambah produk untuk mulai.</td></tr>`;
}
function renderCart(){
 const ids=Object.keys(cart).map(Number).filter(i=>byId(i));
 let n=0,t=0;
 $("#items").innerHTML=ids.length?ids.map(i=>{const x=byId(i),q=cart[i];n+=q;t+=q*x.p;return `<div class="ci"><div class="mini">${svg(x.c)}</div><div>${esc(x.n)}<br><span class="price" style="font-size:13px">${rp(x.p)}</span></div><div class="qty"><button data-m="${i}" aria-label="Kurangi">−</button>${q}<button data-pl="${i}" aria-label="Tambah">+</button></div></div>`}).join(""):`<div class="empty">Keranjang masih kosong. Tambahkan produk dari toko.</div>`;
 $("#cnt").textContent=n;$("#total").textContent=rp(t);
}
function render(){$("#vToko").hidden=view!=="toko";$("#vAdmin").hidden=view!=="admin";
 document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===view));
 view==="toko"?renderShop():renderAdmin();renderCart()}
function setView(v){view=v;try{location.hash=v}catch(e){}render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(d.v)return setView(d.v);
 if(d.cat){cat=d.cat;return renderShop()}
 if(d.buy){const x=byId(+d.buy);const q=(cart[x.id]||0)+1;if(q>x.s)return toast("Stok hanya "+x.s);cart[x.id]=q;renderCart();return toast("Ditambahkan ke keranjang")}
 if(d.pl){const x=byId(+d.pl);if((cart[x.id]||0)+1>x.s)return toast("Stok hanya "+x.s);cart[x.id]++;return renderCart()}
 if(d.m){const i=+d.m;if(--cart[i]<=0)delete cart[i];return renderCart()}
 if(d.edit)return openForm(+d.edit);
 if(d.del){delId=+d.del;$("#cdt").textContent=byId(delId).n+" akan dihapus dari katalog.";return $("#cd").showModal()}
});
$("#q").addEventListener("input",render);
$("#shop").onclick=()=>$("#grid").scrollIntoView({behavior:"smooth"});
$("#cartOpen").onclick=()=>$("#drawer").classList.add("open");
$("#cartClose").onclick=()=>$("#drawer").classList.remove("open");
$("#checkout").onclick=()=>{const ids=Object.keys(cart).map(Number).filter(byId);if(!ids.length)return toast("Keranjang masih kosong");
 ids.forEach(i=>{byId(i).s-=cart[i]});cart={};save();$("#drawer").classList.remove("open");render();toast("Pesanan dibuat")};
$("#fc").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
function openForm(id){editId=id||null;const x=id?byId(id):{n:"",c:CATS[0],p:"",s:"",d:""};
 $("#dt").textContent=id?"Ubah produk":"Tambah produk";
 $("#fn").value=x.n;$("#fc").value=x.c;$("#fp").value=x.p;$("#fs").value=x.s;$("#fd").value=x.d;$("#err").textContent="";$("#dlg").showModal()}
$("#add").onclick=()=>openForm();
$("#fx").onclick=()=>$("#dlg").close();
$("#fsave").onclick=()=>{
 const n=$("#fn").value.trim(),p=+$("#fp").value,s=+$("#fs").value;
 if(!n)return $("#err").textContent="Isi nama produk.";
 if(!(p>0))return $("#err").textContent="Harga harus lebih dari 0.";
 if($("#fs").value===""||s<0||!Number.isInteger(s))return $("#err").textContent="Stok harus berupa bilangan 0 atau lebih.";
 const o={n,c:$("#fc").value,p,s,d:$("#fd").value.trim()};
 if(editId)Object.assign(byId(editId),o);else P.push({id:Date.now(),...o});
 save();$("#dlg").close();render();toast(editId?"Produk diubah":"Produk ditambahkan")};
$("#cn").onclick=()=>$("#cd").close();
$("#cy").onclick=()=>{P=P.filter(x=>x.id!==delId);delete cart[delId];save();$("#cd").close();render();toast("Produk dihapus")};
view=location.hash==="#admin"?"admin":"toko";render();
</script>
</body>
</html>
